<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aniera Business Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="business-card-wrap">
    <section class="business-card front-card" aria-label="Business card front">
      <div class="front-logo">
        <img src="assets/logo.png" alt="Aniera Home Services Marketplace logo">
      </div>

      <div class="front-info">
        <h1>LADY ANN BUSLOY</h1>
        <p class="role">Project Leader</p>
        <div class="divider"></div>
        <p class="tagline">Trusted Home Services<br>at Your Fingertips</p>
      </div>
    </section>

    <section class="business-card back-card" aria-label="Business card back">
      <div class="back-content">
        <img class="qr" src="assets/qr.png" alt="QR code">
        <div class="contact-divider"></div>

        <div class="contacts">
          <p><span class="icon">☎</span> 0938-823-4567</p>
          <p><span class="icon">✉</span> info@aniera.ph</p>
          <p><span class="icon">⌁</span> www.aniera.ph</p>
          <p><span class="icon">●</span> Lupon Davao<br><span class="indent">Oriental</span></p>
        </div>
      </div>

      <footer>Trusted. Reliable. Convenient.</footer>
    </section>
  </main>
</body>
</html>
